[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "moui"
version = "0.2.0"
description = "moui workspace — unified platform CLI"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "httpx>=0.24",          # runtime: the catalogue TUI client + serve API
    "markdown-it-py>=3.0",
    "pygments>=2.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "requests>=2.28",
    "textual>=0.50",
    "trafilatura>=1.6",
    "watchdog>=3.0",
    "pydantic>=2.0",
    "ruamel.yaml>=0.18",
    "python-ulid>=2.0",
    "pyrage>=1.1",
    "Pillow>=10.0",
    "sqlite-vec>=0.1.9",
    "tinycss2>=1.3",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.34"]
export-pdf = ["playwright>=1.40", "Pillow>=10.0"]
export-pptx = ["python-pptx>=0.6"]
export-xlsx = ["openpyxl>=3.1"]
images = ["Pillow>=10.0"]
encrypt = ["cryptography>=41.0", "mnemonic>=0.20"]
dev = ["pytest>=7.0", "ruff>=0.4", "pytest-asyncio>=0.23"]   # httpx is a runtime dep now

[project.scripts]
mo = "cli.moui:main"
moui-sync = "cli.sync.daemon.main:main"

[tool.setuptools.packages.find]
include = ["cli*", "shapes*", "corpus_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "shapes/grove/exporters"]
