name: stat-card
description: Large statistic number with label and optional gradient progress bar
theme-requires:
  - bar-gradient-from
  - bar-gradient-to
fields:
  stat:
    type: string
    required: true
    description: The display number (e.g. "60.6%")
  label:
    type: string
    required: true
    description: Description text below the number
  bar:
    type: number
    required: false
    description: Progress value 0-100, renders gradient bar when present
