# Deck pitch theme — 006 identity (Montserrat, teal/coral)

font-body: montserrat
font-heading: montserrat
font-mono: jetbrains-mono

font-base: "clamp(1rem, 1.4vw, 1.6rem)"
scale-sm: 0.875
scale-md: 1
scale-lg: 1.25
scale-xl: 1.5
scale-xxl: 2
scale-display: 3.5

weight-body: 400
weight-heading: 700
weight-label: 500

leading-body: 1.75
leading-heading: 1.15

letter-spacing-heading: -0.03em

palette:
  white: "#ffffff"
  gray-50: "#f8fafc"
  gray-100: "#f1f5f9"
  gray-200: "#e2e8f0"
  gray-300: "#cbd5e1"
  gray-400: "#94a3b8"
  gray-500: "#64748b"
  gray-600: "#475569"
  gray-700: "#334155"
  gray-800: "#1e293b"
  gray-900: "#0f172a"
  black: "#020617"
  dark: "#0f172a"
  midnight: "#1a1a2e"
  light: "#f8fafc"
  warm: "#f1f5f9"
  accent: "#06b6d4"
  accent-light: "#22d3ee"
  accent-dark: "#0891b2"
  coral: "#f97316"
  coral-light: "#fb923c"
  muted: "#64748b"
  warm-yellow: "#fbbf24"
  warm-red: "#ef4444"

gradients:
  accent-coral: "linear-gradient(90deg, #06b6d4, #f97316)"
  warm-sunset: "linear-gradient(90deg, #fbbf24, #ef4444)"
  dark-fade: "linear-gradient(135deg, #0f172a, #1a1a2e)"

borders:
  thin: "1px solid"
  thick: "2px solid"
  dotted: "1px dotted"
  dashed: "2px dashed"

color-bg: white
color-text: dark
color-heading: dark
color-label: accent
color-muted: muted

space-sm: 1rem
space-md: 2rem
space-lg: 4rem
space-xl: 6rem

slide-width: 1280px
slide-height: 720px
slide-padding: "4rem 6rem"

default-statement-size: xl

reveal:
  type: slide
  stagger: true
  speed: 0.8

bar-gradient-from: accent
bar-gradient-to: coral

effects:
  shimmer:
    stripe: warm-yellow
    duration: 5s
    loop: false
  glow:
    color: accent
    radius: 120px
    opacity: 0.3
  underline:
    colors: [accent, coral]
    width: 60px
    height: 3px
  stripe:
    colors: [accent, coral]
    height: 6px
    position: bottom
